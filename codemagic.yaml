workflows:
  android-apk:
    name: Hodhodak Android APK
    max_build_duration: 30
    environment:
      flutter: stable
      android_signing:
        - hodhodak_keystore
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
